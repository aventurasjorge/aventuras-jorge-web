<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flex Zone Boundary Drawer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  /* Leaflet's own CSS, inlined (kept minimal to what this page actually uses) */
  .leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane > svg,.leaflet-pane > canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
  .leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent}
  .leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-user-drag:none}
  .leaflet-tile{filter:inherit;visibility:hidden}
  .leaflet-tile-loaded{visibility:inherit}
  .leaflet-zoom-box{width:0;height:0;-moz-box-sizing:border-box;box-sizing:border-box;z-index:800}
  .leaflet-overlay-pane svg{-moz-user-select:none}
  .leaflet-pane{z-index:400}
  .leaflet-tile-pane{z-index:200}
  .leaflet-overlay-pane{z-index:400}
  .leaflet-shadow-pane{z-index:500}
  .leaflet-marker-pane{z-index:600}
  .leaflet-tooltip-pane{z-index:650}
  .leaflet-popup-pane{z-index:700}
  .leaflet-map-pane canvas{z-index:100}
  .leaflet-map-pane svg{z-index:200}
  .leaflet-vml-shape{width:1px;height:1px}
  .lvml{behavior:url(#default#VML);display:inline-block;position:absolute}
  .leaflet-control{position:relative;z-index:800;pointer-events:visiblePainted;pointer-events:auto}
  .leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
  .leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
  .leaflet-control{float:left;clear:both}
  .leaflet-right .leaflet-control{float:right}
  .leaflet-top .leaflet-control{margin-top:10px}
  .leaflet-bottom .leaflet-control{margin-bottom:10px}
  .leaflet-left .leaflet-control{margin-left:10px}
  .leaflet-right .leaflet-control{margin-right:10px}
  .leaflet-bar{box-shadow:0 1px 5px rgba(0,0,0,0.65);border-radius:4px}
  .leaflet-bar a{background-color:#fff;border-bottom:1px solid #ccc;width:26px;height:26px;line-height:26px;display:block;text-align:center;text-decoration:none;color:black}
  .leaflet-bar a:last-child{border-bottom:none;border-bottom-left-radius:4px;border-bottom-right-radius:4px}
  .leaflet-bar a:hover,.leaflet-bar a:focus{background-color:#f4f4f4}
  .leaflet-bar a:first-child{border-top-left-radius:4px;border-top-right-radius:4px}
  .leaflet-touch .leaflet-bar a{width:30px;height:30px;line-height:30px}
  .leaflet-control-zoom-in,.leaflet-control-zoom-out{font:bold 18px Lucida Console,Monaco,monospace;text-indent:1px}
  .leaflet-control-attribution{background:#fff;background:rgba(255,255,255,0.85);margin:0;padding:0 5px;color:#333;font:11px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
  .leaflet-control-attribution a{color:#0078A8}

  :root{
    --bg:#f5f6f8; --panel:#ffffff; --border:#dfe3e8; --text:#1c2530; --muted:#697386;
    --accent:#2563eb; --accent-dark:#1d4ed8; --danger:#dc2626; --good:#16a34a; --warn:#b45309;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:var(--bg)}
  #app{display:flex;height:100vh;width:100vw}
  #map{flex:1 1 auto;height:100%}
  #panel{width:380px;flex:0 0 380px;background:var(--panel);border-left:1px solid var(--border);
    display:flex;flex-direction:column;overflow-y:auto}
  .section{padding:14px 16px;border-bottom:1px solid var(--border)}
  .section h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 10px}
  label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
  input[type=text],input[type=number],textarea,select{
    width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:6px;font-size:13px;
    font-family:inherit;background:#fff;color:var(--text)}
  textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;resize:vertical}
  .row{display:flex;gap:8px}
  .row > *{flex:1}
  button{cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text);
    padding:7px 10px;border-radius:6px;font-size:13px;font-weight:500}
  button:hover{background:#f2f4f7}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:var(--accent-dark)}
  button.danger{color:var(--danger);border-color:#fca5a5}
  button.danger:hover{background:#fef2f2}
  button:disabled{opacity:.45;cursor:not-allowed}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .preset{display:block;width:100%;text-align:left;margin-bottom:6px}
  .preset small{display:block;color:var(--muted);font-weight:400}
  .parts-list{margin-top:8px}
  .part-chip{display:flex;align-items:center;justify-content:space-between;
    background:#f2f4f7;border:1px solid var(--border);border-radius:6px;padding:6px 8px;margin-bottom:6px;font-size:12px}
  .part-chip.active{border-color:var(--accent);background:#eff6ff}
  .part-chip button{padding:2px 7px;font-size:11px}
  .hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:6px}
  .status{font-size:12px;padding:8px 10px;border-radius:6px;margin-top:8px}
  .status.ok{background:#f0fdf4;color:var(--good);border:1px solid #bbf7d0}
  .status.warn{background:#fffbeb;color:var(--warn);border:1px solid #fde68a}
  #out{white-space:pre-wrap;word-break:break-all}
  .copybar{display:flex;gap:8px;margin-top:8px}
  .vcount{font-size:12px;color:var(--muted)}
  .searchwrap{position:relative}
  #searchResults{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);
    border-top:none;border-radius:0 0 6px 6px;max-height:180px;overflow-y:auto;z-index:2000;display:none}
  #searchResults div{padding:6px 9px;font-size:12px;cursor:pointer;border-bottom:1px solid #f0f0f0}
  #searchResults div:hover{background:#f2f4f7}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="panel">

    <div class="section">
      <h2>1. Find the area</h2>
      <div class="searchwrap">
        <input type="text" id="searchBox" placeholder="Search a place or address…">
        <div id="searchResults"></div>
      </div>
      <div class="hint">Jump straight to one of the four zones that need manual tracing:</div>
      <div class="btnrow" style="flex-direction:column">
        <button class="preset" data-lat="41.128" data-lng="-75.417" data-zoom="13">Coolbaugh Twp, PA<small>PA-611 / T591 / Sterling Rd / Pocono Farms</small></button>
        <button class="preset" data-lat="40.999" data-lng="-75.903" data-zoom="14">Freeland, PA + Foster Twp<small>west of Juniper St, north of Hazle St, east of Birch St</small></button>
        <button class="preset" data-lat="40.960" data-lng="-75.975" data-zoom="13">Hazleton / West Hazleton, PA<small>north of PA-424, east of N Broad St/Susquehanna Blvd</small></button>
        <button class="preset" data-lat="40.831" data-lng="-73.920" data-zoom="12">Upper Manhattan / Bronx, NY<small>Manhattan N of 125th St + Bronx pocket (draw as 2 parts)</small></button>
      </div>
    </div>

    <div class="section">
      <h2>2. Draw the boundary</h2>
      <div class="hint">Click the map to drop points for the current part. Click the first point again (or press "Finish part") to close the ring.</div>
      <div class="btnrow">
        <button id="undoPoint">Undo last point</button>
        <button id="finishPart">Finish part</button>
      </div>
      <div class="btnrow">
        <button id="newPart">+ Add another part</button>
        <button id="clearAll" class="danger">Clear everything</button>
      </div>
      <div class="vcount" id="vcount">0 points in current part</div>
      <div class="parts-list" id="partsList"></div>
    </div>

    <div class="section">
      <h2>3. Zone details</h2>
      <label>Zone code</label>
      <input type="text" id="zoneCode" placeholder="e.g. FREELAND (DOOR)">
      <label>Zone name</label>
      <input type="text" id="zoneName" placeholder="e.g. Freeland, PA (Door-to-Door)">
      <div class="row">
        <div>
          <label>Fare surcharge</label>
          <input type="number" id="fareSurcharge" value="0" step="0.01" min="0">
        </div>
        <div>
          <label>Advance booking minutes</label>
          <input type="number" id="advanceBooking" value="0" step="1" min="0">
        </div>
      </div>
    </div>

    <div class="section" style="flex:1">
      <h2>4. Export</h2>
      <button id="buildOutput" class="primary" style="width:100%">Build row for flex_zones sheet</button>
      <div id="statusBox"></div>
      <div id="outputWrap" style="display:none">
        <label>boundary_geojson (paste this into that column)</label>
        <textarea id="out" rows="6" readonly></textarea>
        <div class="copybar">
          <button id="copyGeojson" style="flex:1">Copy boundary_geojson</button>
          <button id="copyRow" style="flex:1">Copy full row (tab-separated)</button>
        </div>
      </div>
      <label style="margin-top:16px">Load / edit existing GeoJSON</label>
      <textarea id="importBox" rows="3" placeholder="Paste a Polygon or MultiPolygon GeoJSON here to load it onto the map for editing"></textarea>
      <button id="importBtn" style="width:100%;margin-top:6px">Load onto map</button>
    </div>

  </div>
</div>

<script>
const map = L.map('map').setView([41.0, -75.9], 9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// ---- state: a zone is one or more "parts" (rings of [lng,lat] pairs) ----
// Each part tracks whether it's been closed ("finished"); once finished, new
// map clicks automatically start a fresh part instead of silently appending to
// a shape you already closed (that mistake used to draw a line connecting two
// unrelated areas together).
let parts = [{ points: [], finished: false }];
let activeIdx = 0;
let vertexMarkers = [];      // markers for the active part's vertices
let partLayers = [];         // finished/active polyline+polygon layers, one entry per part index (or null)

function activePart(){ return parts[activeIdx].points; }

function redrawActivePart(){
  // clear old vertex markers + active layer
  vertexMarkers.forEach(m => map.removeLayer(m));
  vertexMarkers = [];
  if (partLayers[activeIdx]) { map.removeLayer(partLayers[activeIdx]); partLayers[activeIdx] = null; }

  const pts = activePart();
  pts.forEach((p, i) => {
    const marker = L.circleMarker([p.lat, p.lng], {
      radius: 5, color: '#2563eb', fillColor: '#2563eb', fillOpacity: 1
    }).addTo(map);
    if (i === 0 && pts.length > 2) {
      marker.on('click', (e) => { L.DomEvent.stopPropagation(e); finishPart(); });
    }
    vertexMarkers.push(marker);
  });

  if (pts.length >= 2) {
    const latlngs = pts.map(p => [p.lat, p.lng]);
    partLayers[activeIdx] = L.polyline(latlngs, { color: '#2563eb', weight: 2, dashArray: '4,4' }).addTo(map);
  }
  updateVCount();
  renderPartsList();
}

function redrawFinishedPart(idx){
  if (partLayers[idx]) map.removeLayer(partLayers[idx]);
  const pts = parts[idx].points;
  if (pts.length >= 3) {
    partLayers[idx] = L.polygon(pts.map(p => [p.lat, p.lng]), {
      color: idx === activeIdx ? '#2563eb' : '#16a34a',
      fillColor: idx === activeIdx ? '#2563eb' : '#16a34a',
      fillOpacity: 0.15, weight: 2
    }).addTo(map);
  }
}

function updateVCount(){
  document.getElementById('vcount').textContent =
    activePart().length + ' point(s) in current part' + (parts.length > 1 ? ` (part ${activeIdx+1} of ${parts.length})` : '');
}

function renderPartsList(){
  const wrap = document.getElementById('partsList');
  wrap.innerHTML = '';
  parts.forEach((part, i) => {
    const p = part.points;
    const div = document.createElement('div');
    div.className = 'part-chip' + (i === activeIdx ? ' active' : '');
    div.innerHTML = `<span>Part ${i+1} — ${p.length} pt${p.length===1?'':'s'}${part.finished?' ✓ finished':''}</span>`;
    const btnWrap = document.createElement('span');
    if (parts.length > 1) {
      const del = document.createElement('button');
      del.textContent = 'Delete';
      del.onclick = (e) => { e.stopPropagation(); deletePart(i); };
      btnWrap.appendChild(del);
    }
    div.appendChild(btnWrap);
    div.onclick = () => { activeIdx = i; redrawAll(); };
    wrap.appendChild(div);
  });
}

function redrawAll(){
  vertexMarkers.forEach(m => map.removeLayer(m));
  vertexMarkers = [];
  partLayers.forEach(l => { if (l) map.removeLayer(l); });
  partLayers = new Array(parts.length).fill(null);
  parts.forEach((p, i) => {
    if (i === activeIdx) redrawActivePart();
    else redrawFinishedPart(i);
  });
  updateVCount();
  renderPartsList();
}

map.on('click', (e) => {
  // If the currently-active part is already finished (closed), don't append to
  // it -- silently start a brand-new part instead, so panning to a different
  // area and clicking can never draw a line back to a shape you already closed.
  if (parts[activeIdx].finished) {
    parts.push({ points: [], finished: false });
    activeIdx = parts.length - 1;
  }
  activePart().push({ lat: e.latlng.lat, lng: e.latlng.lng });
  redrawActivePart();
});

document.getElementById('undoPoint').onclick = () => {
  activePart().pop();
  redrawActivePart();
};

function finishPart(){
  if (activePart().length < 3) { alert('Need at least 3 points to close a part.'); return; }
  parts[activeIdx].finished = true;
  redrawFinishedPart(activeIdx);
  vertexMarkers.forEach(m => map.removeLayer(m));
  vertexMarkers = [];
  renderPartsList();
}
document.getElementById('finishPart').onclick = finishPart;

document.getElementById('newPart').onclick = () => {
  // No-op if we're already sitting on a fresh, empty, unfinished part.
  if (!parts[activeIdx].finished && activePart().length === 0) return;
  parts.push({ points: [], finished: false });
  activeIdx = parts.length - 1;
  redrawAll();
};

function deletePart(i){
  parts.splice(i, 1);
  if (parts.length === 0) parts = [{ points: [], finished: false }];
  activeIdx = Math.min(activeIdx, parts.length - 1);
  redrawAll();
}

document.getElementById('clearAll').onclick = () => {
  if (!confirm('Clear all parts and points?')) return;
  parts = [{ points: [], finished: false }];
  activeIdx = 0;
  redrawAll();
};

// ---- presets ----
document.querySelectorAll('.preset').forEach(btn => {
  btn.addEventListener('click', () => {
    map.setView([parseFloat(btn.dataset.lat), parseFloat(btn.dataset.lng)], parseInt(btn.dataset.zoom));
  });
});

// ---- search (Nominatim) ----
let searchTimer = null;
const searchBox = document.getElementById('searchBox');
const searchResults = document.getElementById('searchResults');
searchBox.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = searchBox.value.trim();
  if (q.length < 3) { searchResults.style.display = 'none'; return; }
  searchTimer = setTimeout(async () => {
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=5`,
        { headers: { 'Accept': 'application/json' } });
      const data = await res.json();
      searchResults.innerHTML = '';
      if (!data.length) { searchResults.style.display = 'none'; return; }
      data.forEach(item => {
        const div = document.createElement('div');
        div.textContent = item.display_name;
        div.onclick = () => {
          map.setView([parseFloat(item.lat), parseFloat(item.lon)], 14);
          searchResults.style.display = 'none';
          searchBox.value = item.display_name;
        };
        searchResults.appendChild(div);
      });
      searchResults.style.display = 'block';
    } catch (err) { /* offline or blocked -- fine, presets still work */ }
  }, 400);
});
document.addEventListener('click', (e) => {
  if (!searchBox.contains(e.target) && !searchResults.contains(e.target)) searchResults.style.display = 'none';
});

// ---- export ----
function partsToGeoJSON(){
  const closedParts = parts.filter(part => part.points.length >= 3).map(part => {
    const ring = part.points.map(pt => [pt.lng, pt.lat]);
    ring.push(ring[0]); // close the ring
    return ring;
  });
  if (closedParts.length === 0) return null;
  if (closedParts.length === 1) {
    return { type: 'Polygon', coordinates: [closedParts[0]] };
  }
  return { type: 'MultiPolygon', coordinates: closedParts.map(ring => [ring]) };
}

document.getElementById('buildOutput').onclick = () => {
  const geo = partsToGeoJSON();
  const statusBox = document.getElementById('statusBox');
  if (!geo) {
    statusBox.innerHTML = '<div class="status warn">No finished part yet — draw at least 3 points and click "Finish part".</div>';
    document.getElementById('outputWrap').style.display = 'none';
    return;
  }
  const code = document.getElementById('zoneCode').value.trim();
  const name = document.getElementById('zoneName').value.trim();
  const fare = document.getElementById('fareSurcharge').value || '0';
  const adv = document.getElementById('advanceBooking').value || '0';
  const gjString = JSON.stringify(geo);
  document.getElementById('out').value = gjString;
  document.getElementById('outputWrap').style.display = 'block';
  document.getElementById('copyRow').onclick = () => {
    const row = [code, name, '', fare, adv, gjString].join('\t');
    navigator.clipboard.writeText(row);
  };
  document.getElementById('copyGeojson').onclick = () => {
    navigator.clipboard.writeText(gjString);
  };
  statusBox.innerHTML = `<div class="status ok">Built ${geo.type} with ${closedPartsCount(geo)} part(s). Ready to copy.</div>`;
};

function closedPartsCount(geo){
  return geo.type === 'Polygon' ? 1 : geo.coordinates.length;
}

// ---- import existing GeoJSON for editing ----
document.getElementById('importBtn').onclick = () => {
  let geo;
  try { geo = JSON.parse(document.getElementById('importBox').value); }
  catch { alert('That is not valid JSON.'); return; }
  let rings = [];
  if (geo.type === 'Polygon') rings = [geo.coordinates[0]];
  else if (geo.type === 'MultiPolygon') rings = geo.coordinates.map(p => p[0]);
  else { alert('Only Polygon or MultiPolygon geometries are supported.'); return; }

  parts = rings.map(ring => {
    const pts = ring.map(([lng, lat]) => ({ lat, lng }));
    // drop the closing point if it duplicates the first
    if (pts.length > 1 && pts[0].lat === pts[pts.length-1].lat && pts[0].lng === pts[pts.length-1].lng) pts.pop();
    return { points: pts, finished: true };
  });
  activeIdx = 0;
  redrawAll();
  // fit the map to the loaded shape
  const all = parts.flatMap(part => part.points).map(p => [p.lat, p.lng]);
  if (all.length) map.fitBounds(all, { padding: [30,30] });
};

redrawAll();
</script>
</body>
</html>
